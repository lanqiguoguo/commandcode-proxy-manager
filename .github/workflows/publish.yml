name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read upstream version
        id: upstream
        run: |
          V_TAG=$(cut -d@ -f1 UPSTREAM_VERSION)
          V_COMMIT=$(cut -d@ -f2 UPSTREAM_VERSION | cut -c1-12)
          {
            echo "tags<<TAGS_EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY}:latest"
            echo "ghcr.io/${GITHUB_REPOSITORY}:upstream-${V_TAG}"
            echo "ghcr.io/${GITHUB_REPOSITORY}:upstream-${V_COMMIT}"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.upstream.outputs.tags }}
