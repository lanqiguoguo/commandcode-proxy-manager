name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read upstream version
        id: upstream
        run: |
          V_TAG=$(cut -d@ -f1 UPSTREAM_VERSION)
          V_COMMIT=$(cut -d@ -f2 UPSTREAM_VERSION | cut -c1-12)
          echo "tags=latest
upstream-$V_TAG
upstream-$V_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:upstream-$V_TAG
            ghcr.io/${{ github.repository }}:upstream-$V_COMMIT
