name: upstream-sync
on:
  schedule:
    - cron: "0 20 * * *"     # 决策 10：每天轮询上游正式版（UTC 20:00 = 北京时间次日凌晨 4 点）
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-release]
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check latest upstream
        id: check
        run: |
          CURRENT_TAG=$(cut -d@ -f1 UPSTREAM_VERSION)
          CURRENT_COMMIT=$(cut -d@ -f2 UPSTREAM_VERSION)
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/MAXeaglet/commandcode-proxy/releases/latest | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -1)
          MASTER_HEAD=$(git ls-remote https://github.com/MAXeaglet/commandcode-proxy.git refs/heads/master | cut -f1)
          # 与新 sync-upstream.sh 语义一致：
          # 有 release → 只比较 release tag；无 release → 回退比较 master HEAD（且当前记录须为 master，避免有 release 后每天空转）
          NEED_SYNC=0
          if [ -n "$LATEST_RELEASE" ]; then
            if [ "$LATEST_RELEASE" != "$CURRENT_TAG" ]; then NEED_SYNC=1; fi
          else
            if [ -n "$MASTER_HEAD" ] && [ "$MASTER_HEAD" != "$CURRENT_COMMIT" ] && [ "$CURRENT_TAG" = "master" ]; then NEED_SYNC=1; fi
          fi
          echo "need_sync=$NEED_SYNC" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT_TAG@$CURRENT_COMMIT latest_release=$LATEST_RELEASE master_head=$MASTER_HEAD"
      - name: Sync upstream and open PR
        if: steps.check.outputs.need_sync == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/sync-upstream.sh
          # L-g：同步产物冒烟——sync-upstream.sh 内已做 proxy.mjs 语法校验，
          # 这里补仓库级快速验证：unit 不依赖网络/端口（e2e 需固定端口不适合
          # 在 PR 自动流程跑），可拦截同步后回归；失败则中止不开 PR
          node scripts/unit.mjs || { echo "ERROR: 上游同步后 unit 冒烟失败，不开 PR"; exit 1; }
          git add upstream UPSTREAM_VERSION
          if git diff --cached --quiet; then
            echo "No actual changes; skip PR."
            exit 0
          fi
          BRANCH="chore/upstream-sync-$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)"
          TITLE="chore: sync upstream $(cat UPSTREAM_VERSION)"
          # 存量去重：同版本 open PR 已存在则不再重复开（cron 每日跑，PR 挂几天就会堆几个）
          # 不用 --search（TITLE 含冒号会被解析成 search qualifier）；TITLE 形如
          # "chore: sync upstream <tag>@<sha>"，无单引号，可安全内插进 jq 表达式
          EXISTING=$(gh pr list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$EXISTING" ]; then
            echo "Open PR #$EXISTING already covers [$TITLE]; skip creating duplicate."
            exit 0
          fi
          git checkout -b "$BRANCH"
          git commit -m "$TITLE"
          git push origin "$BRANCH"
          gh pr create \
            --base "$GITHUB_REF_NAME" \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "自动上游同步 PR：本 PR 由 upstream-sync workflow 生成，替换 vendored 的上游代码（upstream/ 目录）并更新 UPSTREAM_VERSION。属于第三方代码变更，请人工审阅后再合并。注意：若本 PR 的 UPSTREAM_VERSION 为 master@… 而上游当时存在更新的 release tag，说明同步时 release API 不可达走了降级路径——请关闭本 PR 等次日按 release tag 重开。"
