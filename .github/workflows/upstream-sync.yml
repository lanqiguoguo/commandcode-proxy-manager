name: upstream-sync
on:
  schedule:
    - cron: "0 20 * * *"     # 决策 10：每天轮询上游正式版（UTC 20:00 = 北京时间次日凌晨 4 点）
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-release]

# Job-level permissions below deliberately start from no access. The write job
# can publish only a candidate branch; the protected default branch still
# requires the repository's normal PR review/approval rules.
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      need_sync: ${{ steps.check.outputs.need_sync }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Check latest upstream
        id: check
        env:
          UPSTREAM_URL: https://github.com/MAXeaglet/commandcode-proxy.git
          UPSTREAM_API: https://api.github.com/repos/MAXeaglet/commandcode-proxy/releases/latest
        run: |
          set -euo pipefail

          die() {
            printf 'ERROR: %s\n' "$*" >&2
            exit 1
          }

          require_git_object_id() {
            local object_id=$1
            if [[ ! "$object_id" =~ ^[0-9a-fA-F]{40}$ && ! "$object_id" =~ ^[0-9a-fA-F]{64}$ ]]; then
              die "上游 ref 的 commit id 格式无效：$object_id"
            fi
          }

          # BEGIN upstream-sync decision check
          : "${GITHUB_OUTPUT:?GITHUB_OUTPUT is required}"
          : "${UPSTREAM_URL:?UPSTREAM_URL is required}"
          : "${UPSTREAM_API:?UPSTREAM_API is required}"

          TAG_PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          if [[ -L UPSTREAM_VERSION || ! -f UPSTREAM_VERSION ]]; then
            die 'UPSTREAM_VERSION 必须是 regular file'
          fi
          CURRENT_VERSION=$(<UPSTREAM_VERSION)
          CURRENT_TAG=${CURRENT_VERSION%@*}
          CURRENT_COMMIT=${CURRENT_VERSION##*@}
          if [[ -z "$CURRENT_TAG" || "$CURRENT_TAG" == "$CURRENT_VERSION" ]]; then
            die "UPSTREAM_VERSION 格式无效：$CURRENT_VERSION"
          fi
          if [[ "$CURRENT_TAG" != master ]] && [[ ! "$CURRENT_TAG" =~ $TAG_PATTERN ]]; then
            die "当前上游 tag 格式无效：$CURRENT_TAG"
          fi
          require_git_object_id "$CURRENT_COMMIT"

          CHECK_TMP=$(mktemp -d)
          trap 'rm -rf -- "$CHECK_TMP"' EXIT
          API_BODY="$CHECK_TMP/release-api.json"
          API_STATUS_FILE="$CHECK_TMP/release-api.status"
          API_ERROR_FILE="$CHECK_TMP/release-api.error"
          if ! curl -sS --connect-timeout 10 --max-time 30 -L \
            --output "$API_BODY" --write-out '%{http_code}' "$UPSTREAM_API" > "$API_STATUS_FILE"; then
            die "release API 请求失败（网络错误或响应不完整）：$UPSTREAM_API；不会回退 master"
          fi

          HTTP_STATUS=$(<"$API_STATUS_FILE")
          # Keep the local file:// fixture convention used by F01; real API
          # traffic is HTTP(S) and must always provide a real status code.
          if [[ "$UPSTREAM_API" == file://* && "$HTTP_STATUS" == 000 ]]; then
            HTTP_STATUS=200
          fi
          if [[ ! "$HTTP_STATUS" =~ ^[0-9]{3}$ ]]; then
            die "release API 返回了无效 HTTP 状态：$HTTP_STATUS；不会回退 master"
          fi
          case "$HTTP_STATUS" in
            200|404) ;;
            *) die "release API HTTP/API 错误：HTTP $HTTP_STATUS；不会回退 master" ;;
          esac

          if API_RESULT=$(node - "$API_BODY" "$HTTP_STATUS" 2>"$API_ERROR_FILE" <<'NODE'
          const fs = require("node:fs");

          const bodyPath = process.argv[2];
          const status = Number(process.argv[3]);
          const isObject = (value) => value !== null && typeof value === "object" && !Array.isArray(value);
          const hasOwn = (value, key) => Object.prototype.hasOwnProperty.call(value, key);
          const fail = (code, message) => {
            console.error(message);
            process.exit(code);
          };

          let payload;
          try {
            payload = JSON.parse(fs.readFileSync(bodyPath, "utf8"));
          } catch (error) {
            fail(2, `畸形 JSON：${error instanceof Error ? error.message : String(error)}`);
          }

          if (!isObject(payload)) fail(3, "响应结构无效：顶层必须是 JSON object");

          if (status === 404) {
            if (payload.message === "Not Found" && (!hasOwn(payload, "tag_name") || payload.tag_name === null)) {
              console.log("NO_RELEASE");
              process.exit(0);
            }
            fail(3, "响应结构无效：404 不是明确的无 release 响应");
          }

          if (hasOwn(payload, "tag_name") && payload.tag_name === null) {
            console.log("NO_RELEASE");
            process.exit(0);
          }
          if (!hasOwn(payload, "tag_name") || typeof payload.tag_name !== "string" || payload.tag_name === "") {
            fail(3, "响应结构无效：200 必须包含非空字符串 tag_name，或明确的 tag_name:null");
          }
          console.log(payload.tag_name);
          NODE
          ); then
            :
          else
            JSON_STATUS=$?
            case "$JSON_STATUS" in
              2) die "release API 畸形 JSON：$(<"$API_ERROR_FILE")；不会回退 master" ;;
              3) die "release API 响应结构错误：$(<"$API_ERROR_FILE")；不会回退 master" ;;
              *) die "release API 解析失败（退出码 $JSON_STATUS）：$(<"$API_ERROR_FILE")；不会回退 master" ;;
            esac
          fi

          NEED_SYNC=0
          if [[ "$API_RESULT" == NO_RELEASE ]]; then
            RELEASE_STATE=no_release
            if ! MASTER_REFS=$(git ls-remote "$UPSTREAM_URL" refs/heads/master); then
              die '上游 git ls-remote 查询 master 失败；不会回退或设置 need_sync'
            fi
            MASTER_HEAD=$(awk '$2 == "refs/heads/master" { print $1; exit }' <<< "$MASTER_REFS")
            if [[ -z "$MASTER_HEAD" ]]; then
              die '上游 git ls-remote 未返回 refs/heads/master；不会回退或设置 need_sync'
            fi
            require_git_object_id "$MASTER_HEAD"
            if [[ "$CURRENT_TAG" == master && "$MASTER_HEAD" != "$CURRENT_COMMIT" ]]; then
              NEED_SYNC=1
            fi
            UPSTREAM_COMMIT="$MASTER_HEAD"
          else
            LATEST_RELEASE=$API_RESULT
            if [[ ! "$LATEST_RELEASE" =~ $TAG_PATTERN ]]; then
              die "release tag 格式无效：$LATEST_RELEASE；不会回退 master"
            fi
            RELEASE_STATE=release
            RELEASE_REF="refs/tags/$LATEST_RELEASE"
            if ! REMOTE_TAGS=$(git ls-remote "$UPSTREAM_URL" \
              "$RELEASE_REF" "${RELEASE_REF}^{}"); then
              die "上游 git ls-remote 查询 release tag 失败：$LATEST_RELEASE；不会回退 master"
            fi
            REMOTE_TAG_HASH=$(awk -v ref="$RELEASE_REF" '$2 == ref { print $1; exit }' <<< "$REMOTE_TAGS")
            REMOTE_PEELED_HASH=$(awk -v ref="${RELEASE_REF}^{}" '$2 == ref { print $1; exit }' <<< "$REMOTE_TAGS")
            REMOTE_TAG_COMMIT=${REMOTE_PEELED_HASH:-$REMOTE_TAG_HASH}
            if [[ -z "$REMOTE_TAG_COMMIT" ]]; then
              die "上游 git ls-remote 未返回 release tag：$LATEST_RELEASE；不会回退 master"
            fi
            require_git_object_id "$REMOTE_TAG_COMMIT"
            if [[ "$CURRENT_TAG" != "$LATEST_RELEASE" || "$CURRENT_COMMIT" != "$REMOTE_TAG_COMMIT" ]]; then
              NEED_SYNC=1
            fi
            UPSTREAM_COMMIT="$REMOTE_TAG_COMMIT"
          fi

          printf 'need_sync=%s\n' "$NEED_SYNC" >> "$GITHUB_OUTPUT"
          printf 'current=%s latest_release=%s upstream_commit=%s state=%s\n' \
            "$CURRENT_TAG@$CURRENT_COMMIT" "${LATEST_RELEASE:-none}" "$UPSTREAM_COMMIT" "$RELEASE_STATE"
          # END upstream-sync decision check

  sync:
    needs: check
    if: needs.check.outputs.need_sync == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Sync upstream
        run: |
          set -euo pipefail
          bash scripts/sync-upstream.sh
      - name: Verify raw upstream and version
        env:
          UPSTREAM_URL: https://github.com/MAXeaglet/commandcode-proxy.git
        run: |
          set -euo pipefail

          die() {
            printf 'ERROR: %s\n' "$*" >&2
            exit 1
          }

          if [[ -L UPSTREAM_VERSION || ! -f UPSTREAM_VERSION ]]; then
            die 'UPSTREAM_VERSION must be a regular file'
          fi
          VERSION=$(<UPSTREAM_VERSION)
          TAG=${VERSION%@*}
          COMMIT=${VERSION##*@}
          if [[ -z "$TAG" || "$TAG" == "$VERSION" ]]; then
            die "invalid UPSTREAM_VERSION: $VERSION"
          fi
          if [[ "$TAG" != master && ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            die "invalid upstream tag in UPSTREAM_VERSION: $TAG"
          fi
          if [[ ! "$COMMIT" =~ ^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$ ]]; then
            die "invalid upstream commit in UPSTREAM_VERSION: $COMMIT"
          fi

          RAW_TMP=$(mktemp -d)
          trap 'rm -rf -- "$RAW_TMP"' EXIT
          if ! git clone --quiet --depth 1 --branch "$TAG" "$UPSTREAM_URL" "$RAW_TMP/source"; then
            die "could not checkout the ref recorded by UPSTREAM_VERSION: $TAG"
          fi
          CHECKED_OUT=$(git -C "$RAW_TMP/source" rev-parse --verify HEAD^{commit})
          [[ "$CHECKED_OUT" == "$COMMIT" ]] || die "UPSTREAM_VERSION commit does not match checkout: $CHECKED_OUT != $COMMIT"
          REF_COMMIT=$(git -C "$RAW_TMP/source" rev-parse --verify "$TAG^{commit}")
          [[ "$REF_COMMIT" == "$COMMIT" ]] || die "UPSTREAM_VERSION ref does not match checkout: $REF_COMMIT != $COMMIT"

          for file in proxy.mjs config.json package.json; do
            [[ -f "upstream/$file" ]] || die "vendored upstream file is missing: $file"
            [[ -f "$RAW_TMP/source/$file" ]] || die "source upstream file is missing: $file"
            cmp -s "upstream/$file" "$RAW_TMP/source/$file" || die "vendored upstream/$file differs from the checked-out upstream source"
          done
          printf 'raw upstream files match %s@%s byte-for-byte\n' "$TAG" "$COMMIT"
      - name: Static upstream boundary gate
        run: |
          set -euo pipefail

          MATCHES=$(rg -n -i \
            -e 'patch-upstream' \
            -e 'CCPM_.*PATCH_V1' \
            -e 'import\([^)]*upstream/proxy\.mjs' \
            scripts src upstream README.md || true)
          if [[ -n "$MATCHES" ]]; then
            printf '%s\n' 'ERROR: forbidden legacy upstream patch/import path found in production files:' >&2
            printf '%s\n' "$MATCHES" >&2
            exit 1
          fi
          printf '%s\n' 'static upstream boundary gate passed (production paths only)'
      - name: Verify synced syntax and tests
        run: |
          set -euo pipefail
          node --check src/server.mjs
          node --check src/upstreamProcess.mjs
          node --check upstream/proxy.mjs
          node --check scripts/container-smoke-upstream.mjs
          node scripts/unit.mjs
          node scripts/test-upstream-process.mjs
      - name: Build container for smoke
        env:
          SMOKE_IMAGE: ccpm-sync-smoke:${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker build --tag "$SMOKE_IMAGE" .
      - name: Run hosted and external container smoke
        env:
          SMOKE_IMAGE: ccpm-sync-smoke:${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          bash scripts/container-smoke.sh "$SMOKE_IMAGE"
      - name: Prepare sync PR
        id: prepare
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream UPSTREAM_VERSION
          if git diff --cached --quiet; then
            printf 'has_changes=false\n' >> "$GITHUB_OUTPUT"
            echo 'No actual changes; skip PR.'
            exit 0
          fi
          BRANCH="chore/upstream-sync-$(git rev-parse --short=12 HEAD)-$(date -u +%Y%m%d%H%M%S)"
          if [[ "$BRANCH" == "$BASE_BRANCH" || "$BRANCH" != chore/upstream-sync-* ]]; then
            echo 'ERROR: refusing to use the protected base branch as the sync branch' >&2
            exit 1
          fi
          TITLE="chore: sync upstream $(<UPSTREAM_VERSION)"
          git checkout -b "$BRANCH"
          git commit -m "$TITLE"
          {
            printf 'has_changes=true\n'
            printf 'branch=%s\n' "$BRANCH"
          } >> "$GITHUB_OUTPUT"
      - name: Push candidate branch and open PR
        if: steps.prepare.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_BRANCH: ${{ steps.prepare.outputs.branch }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?GITHUB_TOKEN is required}"
          : "${CANDIDATE_BRANCH:?candidate branch is required}"
          TITLE="chore: sync upstream $(<UPSTREAM_VERSION)"
          # The token is introduced only for gh/git operations after the
          # untrusted upstream has been copied and the unit smoke has passed.
          EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [[ -n "$EXISTING" ]]; then
            echo "Open PR #$EXISTING already covers [$TITLE]; skip creating duplicate."
            exit 0
          fi
          gh auth setup-git
          git push --set-upstream origin "$CANDIDATE_BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" \
            --base "$BASE_BRANCH" \
            --head "$CANDIDATE_BRANCH" \
            --title "$TITLE" \
            --body "自动上游同步 PR：本 PR 由 upstream-sync workflow 生成，替换 vendored 的上游代码（upstream/ 目录）并更新 UPSTREAM_VERSION。属于第三方代码变更，请人工审阅后再合并。默认分支受仓库分支保护与 PR 审批规则约束，本流程不会直接写入默认分支。"
